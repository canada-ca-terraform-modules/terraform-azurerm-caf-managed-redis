# .github/workflows/terraform-ci.yml
#
# Runs fmt check, validate, tflint, and terraform test on every push/PR.
# No Azure credentials needed — mock_provider intercepts all API calls in tests.
name: Terraform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform:
    name: Terraform Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "~>1.9"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Terraform Test
        run: terraform test
